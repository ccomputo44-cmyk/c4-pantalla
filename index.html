<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C4 Monitoreo • Prevención Social del Delito</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none">

  <!-- ENCABEZADO INSTITUCIONAL DE ALTO CONTRASTE -->
  <header class="border-b border-slate-800/90 bg-slate-900/95 px-6 py-3.5 flex flex-wrap items-center justify-between gap-4 shadow-lg">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-lg bg-sky-600/20 border border-sky-500/40 flex items-center justify-center text-sky-400 text-xl font-bold">
        🛡️
      </div>
      <div>
        <h1 class="text-base font-black tracking-wider uppercase text-white drop-shadow-sm">CENTRO DE CONTROL Y MONITOREO C4</h1>
        <p class="text-xs font-bold text-sky-300">DIRECCIÓN DE PREVENCIÓN SOCIAL DEL DELITO</p>
      </div>
    </div>

    <div class="flex items-center gap-4">
      <div class="bg-slate-950 px-4 py-1.5 rounded-lg border border-slate-800 font-mono text-emerald-400 text-base font-black tracking-widest" id="relojDigital">
        --:--:--
      </div>
      <a href="admin/login.html" class="bg-slate-800 hover:bg-slate-700 text-xs px-3.5 py-2 rounded-lg font-bold text-slate-200 border border-slate-700 flex items-center gap-1.5 transition-all shadow-md">
        <span>🔐</span> Agregar Datos / Admin
      </a>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL: PANTALLA EXCLUSIVA DEL DÍA -->
  <main class="flex-1 p-6 max-w-7xl w-full mx-auto">
    <!-- BANNER DEL DÍA CON RESALTADO -->
    <div class="panel-institucional rounded-xl p-5 mb-6 border border-slate-800/90 flex flex-wrap items-center justify-between gap-4">
      <div>
        <h2 class="text-lg font-black text-white uppercase tracking-wider">
          PROGRAMACIÓN DEL DÍA: <span class="text-sky-400 underline decoration-sky-500 decoration-2">HOY</span>
        </h2>
        <p class="text-xs text-slate-400 mt-0.5">Despliegue operativo y preventivo asignado para el turno.</p>
      </div>
      <div class="flex items-center gap-3 text-xs font-black">
        <span id="contadorTotalHoy" class="bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-lg text-slate-200 font-mono">
          ACTIVIDADES HOY: 0
        </span>
        <span id="contadorEnVivoHoy" class="bg-red-950/80 border border-red-600/60 px-3 py-1.5 rounded-lg text-red-400 font-mono">
          EN CURSO: 0
        </span>
      </div>
    </div>

    <!-- CUADRÍCULA DE ACTIVIDADES DE HOY -->
    <div id="gridActividades" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <!-- MODAL FLOTANTE MULTI-ALERTA CENTRADO -->
  <div id="modalAlertas" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-950 border-2 border-red-500 rounded-2xl max-w-2xl w-full p-6 shadow-2xl relative">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-red-500 animate-ping"></span>
          <h3 class="text-base font-black text-red-400 uppercase tracking-wider">ALERTA DE DESPLIEGUE EN CURSO</h3>
        </div>
        <button onclick="cerrarTodasAlertas()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded font-bold border border-slate-700">
          Minimizar todas [✕]
        </button>
      </div>
      
      <!-- Listado con scroll si hay muchas alertas simultáneas -->
      <div id="listaAlertasEmergentes" class="space-y-4 max-h-[65vh] overflow-y-auto pr-1"></div>
    </div>
  </div>

  <!-- PASTILLA FLOTANTE INFERIOR PARA REABRIR SI SE MINIMIZARON -->
  <div id="pastillaReabrir" class="hidden fixed bottom-6 right-6 z-40">
    <button onclick="reabrirModalAlertas()" class="bg-red-600 hover:bg-red-500 text-white px-5 py-2.5 rounded-full font-black text-xs shadow-2xl flex items-center gap-2 border border-red-400/80 animate-bounce tracking-wider uppercase">
      <span>🚨</span> <span id="conteoPastillaAlertas">Alertas Activas • Clic para ver</span>
    </button>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/monitor.js"></script>
</body>
</html>
