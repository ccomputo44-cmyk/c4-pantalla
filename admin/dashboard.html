<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Gestión y Captura • C4</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/custom.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">
  
  <header class="border-b border-slate-800 bg-slate-900/95 px-6 py-3.5 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <span class="text-sm font-black text-white uppercase tracking-wider">MÓDULO DE GESTIÓN Y CAPTURA C4</span>
    </div>
    <div class="flex items-center gap-3">
      <a href="../index.html" class="text-xs bg-slate-800 hover:bg-slate-700 px-3.5 py-2 rounded-lg text-slate-200 border border-slate-700 font-bold transition-all">
        📺 Ver Monitor de TV
      </a>
      <button onclick="cerrarSesion()" class="text-xs bg-red-600/20 hover:bg-red-600/40 text-red-400 px-3.5 py-2 rounded-lg border border-red-500/30 font-bold transition-all">
        Cerrar Sesión
      </button>
    </div>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto p-6 space-y-8">
    <!-- FORMULARIO DIRECTO Y SIMPLIFICADO -->
    <section class="panel-institucional rounded-2xl p-6 border border-slate-800 shadow-xl">
      <h2 class="text-lg font-black text-white uppercase tracking-wide mb-4">Captura Manual de Despliegue Operativo</h2>
      <form id="formularioCaptura" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Día de la Semana</label>
            <select id="campoDia" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500 font-bold">
              <option>Lunes</option>
              <option>Martes</option>
              <option selected>Miércoles</option>
              <option>Jueves</option>
              <option>Viernes</option>
              <option>Sábado</option>
              <option>Domingo</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Hora Inicio</label>
            <input type="time" id="campoInicio" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500 font-mono">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Hora Término</label>
            <input type="time" id="campoFin" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500 font-mono">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Nombre de la Actividad</label>
          <input type="text" id="campoNombre" lang="es" spellcheck="true" placeholder="Ej: Operativo Comercio Seguro" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500 font-bold">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Descripción</label>
          <textarea id="campoDescripcion" lang="es" spellcheck="true" rows="3" placeholder="Detalles de la consigna, sectores o corredores..." required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500"></textarea>
        </div>

        <button type="submit" id="btnGuardar" class="bg-emerald-600 hover:bg-emerald-500 text-white font-black px-6 py-2.5 rounded-lg text-xs uppercase tracking-wider transition-all shadow-lg shadow-emerald-600/30">
          Guardar Actividad en el Sistema
        </button>
      </form>
    </section>

    <!-- LISTADO DE ACTIVIDADES PROGRAMADAS -->
    <section class="panel-institucional rounded-2xl p-6 border border-slate-800 shadow-xl">
      <h3 class="text-base font-black text-white uppercase tracking-wide mb-4">Actividades Programadas en el Calendario</h3>
      <div id="contenedorTablaActividades" class="overflow-x-auto"></div>
    </section>

    <!-- BITÁCORA HISTÓRICA Y EXPORTADOR A EXCEL -->
    <section class="panel-institucional rounded-2xl p-6 border border-slate-800 shadow-xl">
      <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
        <div>
          <h3 class="text-base font-black text-white uppercase tracking-wide">Bitácora de Eventos Concluidos</h3>
          <p class="text-xs text-slate-400">Historial para rendición de cuentas y auditoría</p>
        </div>
        <button onclick="exportarExcel()" class="bg-sky-600 hover:bg-sky-500 text-white px-4 py-2 rounded-lg text-xs font-black uppercase tracking-wider shadow-lg shadow-sky-600/30 transition-all">
          📥 Descargar Reporte Mensual (Excel CSV)
        </button>
      </div>
      <div id="contenedorTablaBitacora" class="overflow-x-auto"></div>
    </section>
  </main>

  <!-- LÓGICA DIRECTA INTEGRADA: CERO DEPENDENCIAS EXTERNAS -->
  <script>
    const URL_FIREBASE = "https://c4-monitoreo-8d236-default-rtdb.firebaseio.com";

    // 1. Funciones de Base de Datos
    async function obtenerActividades() {
      try {
        const res = await fetch(`${URL_FIREBASE}/actividades.json`);
        const datos = await res.json();
        if (!datos) return [];
        return Object.keys(datos).map(key => ({ id: key, ...datos[key] }));
      } catch (err) {
        console.error("Error al obtener actividades:", err);
        return [];
      }
    }

    async function guardarActividadRemota(actividad) {
      const res = await fetch(`${URL_FIREBASE}/actividades.json`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(actividad)
      });
      return await res.json();
    }

    async function eliminarActividadRemota(id) {
      await fetch(`${URL_FIREBASE}/actividades/${id}.json`, {
        method: 'DELETE'
      });
    }

    async function obtenerBitacora() {
      try {
        const res = await fetch(`${URL_FIREBASE}/bitacora.json`);
        const datos = await res.json();
        if (!datos) return [];
        return Object.keys(datos).map(key => ({ idFirebase: key, ...datos[key] }));
      } catch (err) {
        console.error("Error al leer bitácora:", err);
        return [];
      }
    }

    // 2. Control de Sesión
    if (sessionStorage.getItem('c4_autenticado') !== 'true') {
      window.location.href = 'login.html';
    }

    function cerrarSesion() {
      sessionStorage.removeItem('c4_autenticado');
      window.location.href = '../index.html';
    }

    // 3. Captura
    const form = document.getElementById('formularioCaptura');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const boton = document.getElementById('btnGuardar');
      const textoOriginal = boton.textContent;
      boton.disabled = true;
      boton.textContent = 'Guardando en la nube...';

      const nuevaActividad = {
        dia: document.getElementById('campoDia').value,
        inicio: document.getElementById('campoInicio').value,
        fin: document.getElementById('campoFin').value,
        nombre: document.getElementById('campoNombre').value.trim(),
        descripcion: document.getElementById('campoDescripcion').value.trim()
      };

      try {
        await guardarActividadRemota(nuevaActividad);
        alert('Actividad registrada exitosamente en la base de datos.');
        form.reset();
        await renderizarTablas();
      } catch (err) {
        alert('Error al conectar con Firebase. Revisa tu conexión.');
        console.error(err);
      } finally {
        boton.disabled = false;
        boton.textContent = textoOriginal;
      }
    });

    // 4. Tablas
    async function renderizarTablas() {
      await renderizarTablaActividades();
      await renderizarTablaBitacora();
    }

    async function renderizarTablaActividades() {
      const contenedor = document.getElementById('contenedorTablaActividades');
      if (!contenedor) return;
      contenedor.innerHTML = '<p class="text-xs text-slate-400 py-3 text-center font-bold">Consultando base de datos...</p>';

      const lista = await obtenerActividades();

      if (lista.length === 0) {
        contenedor.innerHTML = '<p class="text-xs text-slate-500 py-4 text-center">No hay actividades registradas en la base de datos.</p>';
        return;
      }

      let html = `
        <table class="w-full text-left text-xs text-slate-300">
          <thead class="bg-slate-900 text-slate-400 font-bold uppercase border-b border-slate-800">
            <tr>
              <th class="p-3">Día</th>
              <th class="p-3">Horario</th>
              <th class="p-3">Actividad</th>
              <th class="p-3">Descripción</th>
              <th class="p-3 text-right">Acción</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-800/80">
      `;

      lista.forEach(act => {
        html += `
          <tr class="hover:bg-slate-900/40">
            <td class="p-3 font-bold text-white">${act.dia}</td>
            <td class="p-3 font-mono text-sky-400 font-bold">${act.inicio} - ${act.fin}</td>
            <td class="p-3 font-black text-white uppercase">${act.nombre}</td>
            <td class="p-3 text-slate-300 max-w-xs truncate">${act.descripcion}</td>
            <td class="p-3 text-right">
              <button onclick="eliminarActividad('${act.id}')" class="text-red-400 hover:text-red-300 font-bold px-2 py-1 bg-red-950/40 rounded border border-red-800/50">Eliminar</button>
            </td>
          </tr>
        `;
      });

      html += '</tbody></table>';
      contenedor.innerHTML = html;
    }

    async function renderizarTablaBitacora() {
      const contenedor = document.getElementById('contenedorTablaBitacora');
      if (!contenedor) return;

      const bitacora = await obtenerBitacora();

      if (bitacora.length === 0) {
        contenedor.innerHTML = '<p class="text-xs text-slate-500 py-4 text-center">No hay eventos archivados en la bitácora aún.</p>';
        return;
      }

      let html = `
        <table class="w-full text-left text-xs text-slate-300">
          <thead class="bg-slate-900 text-slate-400 font-bold uppercase border-b border-slate-800">
            <tr>
              <th class="p-3">Folio</th>
              <th class="p-3">Fecha / Hora</th>
              <th class="p-3">Actividad</th>
              <th class="p-3">Novedades Reportadas</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-800/80">
      `;

      bitacora.forEach(b => {
        html += `
          <tr class="hover:bg-slate-900/40">
            <td class="p-3 font-mono font-bold text-sky-400">${b.folio || 'N/A'}</td>
            <td class="p-3 font-mono text-slate-400">${b.fecha || ''} ${b.horaRegistro || ''}</td>
            <td class="p-3 font-bold text-white">${b.actividad || ''}</td>
            <td class="p-3 text-slate-300">${b.novedades || ''}</td>
          </tr>
        `;
      });

      html += '</tbody></table>';
      contenedor.innerHTML = html;
    }

    async function eliminarActividad(id) {
      if (!confirm('¿Deseas eliminar permanentemente esta actividad de la base de datos?')) return;
      await eliminarActividadRemota(id);
      await renderizarTablas();
    }

    async function exportarExcel() {
      const bitacora = await obtenerBitacora();
      if (bitacora.length === 0) {
        alert('No hay registros en la bitácora para exportar.');
        return;
      }

      let csv = 'Folio,Fecha,Hora_Registro,Actividad,Novedades\n';
      bitacora.forEach(b => {
        csv += `"${b.folio || ''}","${b.fecha || ''}","${b.horaRegistro || ''}","${(b.actividad || '').replace(/"/g, '""')}","${(b.novedades || '').replace(/"/g, '""')}"\n`;
      });

      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', `Reporte_Mensual_C4_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    window.addEventListener('DOMContentLoaded', renderizarTablas);
  </script>
</body>
</html>
