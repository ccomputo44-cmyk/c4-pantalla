<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrativo • C4</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/custom.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans select-none">
  <div class="panel-institucional rounded-2xl p-8 max-w-md w-full border border-slate-800 shadow-2xl">
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-xl bg-sky-600/20 border border-sky-500/40 text-sky-400 flex items-center justify-center mx-auto mb-3 text-xl font-bold">
        🛡️
      </div>
      <h2 class="text-xl font-black text-white uppercase tracking-wider">Acceso a Gestión C4</h2>
      <p class="text-xs text-sky-300/80 mt-1">Dirección de Prevención Social del Delito</p>
    </div>

    <form id="formLogin" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Usuario</label>
        <input type="text" id="usuario" required placeholder="admin" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Contraseña</label>
        <input type="password" id="password" required placeholder="••••" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-500">
      </div>
      <div id="errorMsg" class="hidden text-xs text-red-400 text-center font-bold">Credenciales no válidas.</div>
      <button type="submit" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-2.5 rounded-lg text-sm transition-all shadow-lg shadow-sky-600/30 uppercase tracking-wider">
        Ingresar al Panel
      </button>
      <a href="../index.html" class="block text-center text-xs text-slate-500 hover:text-slate-300 mt-4 transition-all">
        ← Volver a Pantalla de Monitoreo
      </a>
    </form>
  </div>

  <script>
    document.getElementById('formLogin').addEventListener('submit', (e) => {
      e.preventDefault();
      const u = document.getElementById('usuario').value.trim();
      const p = document.getElementById('password').value.trim();
      if (u === 'admin' && (p === '1234' || p === 'c4tizayuca')) {
        sessionStorage.setItem('c4_autenticado', 'true');
        window.location.href = 'dashboard.html';
      } else {
        document.getElementById('errorMsg').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
